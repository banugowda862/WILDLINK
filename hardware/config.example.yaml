# WILDLINK IoT Edge Node Configuration
device:
  device_id: "WILDLINK-ROAD-001"
  name: "Bandipur NH-766 Thermal Sentinel 1"
  installation_area: "Bandipur Wildlife Corridor Km 24"
  device_type: "thermal_mlx90640_rgb"
  latitude: 11.6664
  longitude: 76.6291
  secret_token: "wildlink-secure-token-default"

server:
  base_url: "http://localhost:8000"
  heartbeat_interval_sec: 60
  detection_poll_interval_sec: 2.0
  request_timeout_sec: 10
  max_retries: 3

thermal_sensor:
  simulate: true  # set false on actual Raspberry Pi with MLX90640
  i2c_bus: 1
  i2c_address: 0x33
  refresh_rate_hz: 4  # 0.5, 1, 2, 4, 8, 16, 32, 64
  min_temperature_threshold: 30.0  # Celsius
  temp_delta_above_ambient: 4.5    # Trigger threshold above ambient

rgb_camera:
  enabled: true
  simulate: true
  camera_index: 0
  capture_width: 1280
  capture_height: 720

ai_inference:
  mode: "heuristic_thermal"  # "heuristic_thermal", "yolo_fusion"
  confidence_threshold: 0.70
  duplicate_suppression_window_sec: 90
